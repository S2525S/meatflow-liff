<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>石垣牛証明書</title>
  <style>
    body { margin: 0; background: #eef3ef; color: #182b22; font: 16px system-ui, sans-serif; }
    main { max-width: 38rem; margin: auto; padding: 24px; }
    h1 { font-size: 24px; }
    body.executive { background:#f6f4ee; min-height:100svh; display:grid; place-items:center; }
    .executive main { box-sizing:border-box; width:min(90vw,22rem); padding:28px; background:#fffefa; border:1px solid #dddcd1; border-radius:20px; box-shadow:0 8px 32px #20382c0c; }
    .executive main::before { content:'MeatFlow'; color:#486252; font-weight:700; letter-spacing:.08em; }
    .executive h1 { margin:12px 0; font-size:28px; }
    .executive button { width:100%; padding:14px; border:0; border-radius:12px; background:#214e3c; color:white; font:700 16px system-ui,sans-serif; cursor:pointer; }
    #workbar { position:fixed; inset:0 0 auto; height:36px; display:flex; align-items:center; justify-content:space-between; padding:0 12px; background:#f6f4ee; font-weight:600; }
    #workbar[hidden], #workframe[hidden] { display:none; }
    #workbar button { width:auto; padding:5px 12px; font-size:13px; }
    #workframe { position:fixed; inset:36px 0 0; width:100%; height:calc(100% - 36px); border:0; background:transparent; }
  </style>
  <link rel="preconnect" href="https://static.line-scdn.net">
  <link rel="preconnect" href="https://api.line.me">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <script id="line-sdk" src="https://static.line-scdn.net/liff/edge/2/sdk.js" async></script>
</head>
<body>
  <main><h1>石垣牛証明書</h1><p id="status" role="status">LINEで閲覧資格を確認しています。</p><button id="retry" type="button" hidden>再試行</button></main>
  <nav id="workbar" hidden><span id="worktitle"></span><button id="direct" type="button">直接開く</button></nav>
  <form id="open-certificates" method="post" action="https://script.google.com/macros/s/AKfycbyu9RR92aTrnCn0aqRIZ3GuyWGnFReG42AzCoR21BdrlluzyES50Zz9VYmF_7xXI2CW/exec">
    <input type="hidden" name="action" value="openCertificatesFromLine">
    <input type="hidden" name="idToken">
    <input type="hidden" name="view">
  </form>
  <script>
    const views = {orders:'受注管理',forecast:'注文予測',print:'受注PDF',cut:'カット予定'};
    const view = new URLSearchParams(location.search).get('view');
    const executive = Object.prototype.hasOwnProperty.call(views,view);
    const quantity = new URLSearchParams(location.search).get('view') === 'quantity';
    const heading = document.querySelector('h1');
    if(executive) document.title = heading.textContent = views[view];
    if(quantity) document.title = heading.textContent = '量目表PDF';
    const status = document.getElementById('status');
    const retry = document.getElementById('retry');
    if (executive) {
      document.body.classList.add('executive');
      status.textContent = 'LINEで本人確認中…';
    }
    retry.onclick = () => location.reload();
    let stage = 'line';
    let deadline = setTimeout(slow, 8000);
    let expired = false;

    function slow() {
      expired = true;
      status.textContent = stage === 'line'
        ? 'LINEの確認に時間がかかっています。'
        : heading.textContent + 'の応答を待っています。';
      retry.hidden = false;
    }

    async function openCertificates() {
      try {
        const sdk = document.getElementById('line-sdk');
        if (!window.liff) {
          await new Promise((resolve, reject) => {
            sdk.addEventListener('load', resolve, {once: true});
            sdk.addEventListener('error', reject, {once: true});
          });
        }
        await liff.init({ liffId: '2010748894-FyJqsDsC', withLoginOnExternalBrowser: false });
        retry.hidden = true;
        expired = false;
        clearTimeout(deadline);
        if (!liff.isInClient() || !liff.isLoggedIn()) {
          status.textContent = 'MeatFlow受注通知のリッチメニューから開いてください。';
          return;
        }
        const token = liff.getIDToken();
        if (!token) throw new Error('LINE token unavailable');
        stage = 'server';
        status.textContent = heading.textContent + 'を開いています。';
        deadline = setTimeout(slow, 12000);
        const form = document.getElementById('open-certificates');
        form.elements.namedItem('idToken').value = token;
        if(executive){ form.elements.namedItem('action').value='openExecutiveFromLine'; form.elements.namedItem('view').value=view; }
        if(quantity) form.elements.namedItem('view').value = 'quantity';
        if (executive) {
          const frame = document.createElement('iframe');
          frame.id = 'workframe';
          frame.name = 'meatflow-work';
          frame.title = views[view];
          frame.allow = 'web-share; clipboard-write';
          frame.style.pointerEvents = "none";
          document.body.appendChild(frame);
          document.getElementById('worktitle').textContent = views[view];
          document.getElementById('workbar').hidden = false;
          document.getElementById('direct').onclick = () => {
            const freshToken = liff.getIDToken();
            if (!freshToken) { location.reload(); return; }
            form.elements.namedItem('idToken').value = freshToken;
            form.target = '_self';
            form.submit();
          };
          frame.addEventListener('load', () => {
            try { if (frame.contentWindow.location.href === 'about:blank') return; } catch (_) { /* Cross-origin app loaded. */ }
            clearTimeout(deadline);
            frame.style.pointerEvents = "auto";
            document.querySelector('main').hidden = true;
          });
          form.target = frame.name;
        } else {
          form.target = '_self';
        }
        form.submit();
      } catch (error) {
        clearTimeout(deadline);
        if (expired) return;
        status.textContent = 'LINEで確認できませんでした。もう一度お試しください。';
        retry.hidden = false;
      }
    }
    openCertificates();
  </script>
</body>
</html>
